# Progetto Xcode dell'app iPhone. Si rigenera con:  cd ios && xcodegen
name: PolarLab
options:
  bundleIdPrefix: it.michelegalella
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  PolarKit:
    path: PolarKit
targets:
  PolarLab:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: PolarKit
        product: PolarKit
      - sdk: HealthKit.framework
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PolarLab
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: PolarLab si collega alla fascia Polar H10 per ricevere ECG, battiti e accelerometro.
        NSHealthShareUsageDescription: PolarLab legge i tuoi allenamenti (frequenza cardiaca, percorso, passo, cadenza…) per esportarli sul Mac. Non scrive nulla in Salute.
        UIBackgroundModes: [bluetooth-central]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.michelegalella.polarlab
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: App/PolarLab.entitlements
        ENABLE_PREVIEWS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
